name: Daily Moneycontrol collection

on:
  schedule:
    # 03:05 UTC = 08:35 Asia/Kolkata, every day including weekends.
    - cron: '5 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-moneycontrol.yml'
      - 'mc_pipeline.py'
      - 'pipeline_config.json'
      - 'scripts/**'
      - 'tests/**'

permissions:
  contents: write

concurrency:
  group: moneycontrol-daily
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out collector and saved history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Check collector and history handling
        run: python -m unittest discover -s tests -v

      - name: Fetch latest available data
        id: collect
        continue-on-error: true
        shell: bash
        run: |
          started_at=$(date -u +'%Y-%m-%dT%H:%M:%S+00:00')
          echo "started_at=$started_at" >> "$GITHUB_OUTPUT"
          python -u mc_pipeline.py run

      - name: Save snapshot and report new or changed values
        id: snapshot
        if: always() && steps.collect.outcome != 'skipped'
        env:
          COLLECTION_STARTED_AT: ${{ steps.collect.outputs.started_at }}
        run: python scripts/snapshot_run.py

      - name: Commit capture and persistent collector state
        if: always() && steps.snapshot.outcome == 'success'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for path in \
            data/moneycontrol/moneycontrol.sqlite3 \
            data/moneycontrol/raw \
            data/moneycontrol/exports \
            data/moneycontrol/snapshots \
            data/moneycontrol/changes.json; do
            if [ -e "$path" ]; then
              git add -f -- "$path"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "data: capture Moneycontrol earnings $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Keep downloadable data and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: moneycontrol-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            data/moneycontrol/moneycontrol.sqlite3
            data/moneycontrol/raw/
            data/moneycontrol/exports/
            data/moneycontrol/snapshots/
            data/moneycontrol/changes.json
            data/moneycontrol/pipeline.log

      - name: Report collection failure
        if: always() && steps.collect.outcome == 'failure'
        run: |
          echo '::error::Collection was partial or failed. Saved data and diagnostics remain available; inspect latest_run.json.'
          exit 1
